packages:
  - "."

overrides:
  protobufjs: ">=7.6.4"
  lodash: ">=4.18.1"
  ws: ">=8.21.0"
  undici: "7.30.1"
  form-data: ">=4.0.6"
  # Keep the Web5/DWN AJV remediation scoped so ESLint's AJV 6 remains unchanged.
  "@tbd54566975/dwn-sdk-js@0.5.1>ajv": "8.18.0"
  "@babel/core": "7.29.7"
  "ajv@8.12.0": "8.18.0"
  axios: ">=1.20.0"
  follow-redirects: "1.16.1"
  uuid: "11.1.1"
  tar: "7.5.21"
  valibot: "1.4.2"
  brace-expansion: ">=5.0.12"
  fast-uri: "4.2.3"
  browserslist: ">=4.28.7"
  qs: ">=6.16.0"
  "@xmldom/xmldom": ">=0.9.12"
  stream-json: "3.7.0"
  toml: ">=4.1.2"
  "zod@^4": "4.6.7"
  http-cache-semantics: "4.3.0"
  pbkdf2: "3.1.7"

minimumReleaseAge: 60
minimumReleaseAgeExclude:
  - "@capacitor/*"
  - "@conxian/market-sdk"
  - "@vitejs/*"
  - "vite"
  - "vitest"

strictDepBuilds: false
allowBuilds:
  "@google/genai": true
  "@swc/core": true
  "bigint-buffer": true
  "bufferutil": true
  "classic-level": true
  "esbuild": true
  "protobufjs": true
  "tiny-secp256k1": true
  "utf-8-validate": true
patchedDependencies:
  http-cache-semantics@4.3.0: patches/http-cache-semantics@4.3.0.patch
