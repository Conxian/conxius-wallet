# CircleCI lane: activates as soon as the project is set up in CircleCI.
version: 2.1
jobs:
  verify:
    docker:
      - image: node:26-bookworm-slim
    resource_class: medium
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-{{ checksum "pnpm-lock.yaml" }}
      - run:
          name: install
          command: npm install -g pnpm@11.28.9 && pnpm install --frozen-lockfile --ignore-scripts
      - save_cache:
          key: npm-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - node_modules
      - run:
          name: build
          command: pnpm run build
workflows:
  ci:
    jobs: [verify]
