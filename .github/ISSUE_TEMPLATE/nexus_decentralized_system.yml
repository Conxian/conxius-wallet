name: Nexus & Decentralized System Initiative
description: Propose or track a Production Readiness, Decentralized Protocol Integration, or Nexus Opportunity initiative.
title: "[NEXUS-DEC] [Protocol/System Name]: [Brief Summary]"
labels: ["Nexus", "Decentralized-Systems", "Production-Readiness"]
body:
  - type: markdown
    attributes:
      value: |
        ## Initiative Overview
        Use this template to track production readiness gaps, Nexus integration opportunities, or operational issue resolutions involving external decentralized protocols.
  - type: dropdown
    id: system_category
    attributes:
      label: Decentralized System Category
      description: Select the protocol or decentralized system domain.
      options:
        - "Bitcoin L2 / Sidechain (Stacks, Liquid, Rootstock, BOB, B2)"
        - "Off-Chain / L2 Scaling (Ark V-UTXO, BitVM2, StateChains, Lightning LDK)"
        - "Sovereign Asset Protocol (Taproot Assets, RGB, Runes, DLCs)"
        - "Cross-Chain / Interoperability (Wormhole, Cosmos/IBC, EVM, FDC3 Treasury)"
        - "Staking & Proof Layer (Babylon Staking, Polyhedra/ZKP, Zero-Knowledge Proofs)"
        - "Core State & Hardware (Conxian Nexus BFF, Agnostic Hardware SDK, Neon/Render)"
    validations:
      required: true
  - type: dropdown
    id: initiative_type
    attributes:
      label: Initiative Type
      description: Select the primary objective of this task.
      options:
        - "Production Readiness Audit / Remediation"
        - "Nexus Business Opportunity & Commercial Integration"
        - "Operational / Technical Issue Resolution (Fees, Latency, Liquidity, Attestation)"
        - "Knowledge Base (KB) Article & Integration Playbook"
    validations:
      required: true
  - type: textarea
    id: candidate_score
    attributes:
      label: Candidate Scoring (Maturity / Mobile-Friendly / Security)
      description: Provide the candidate readiness score out of 15 (Maturity 1-5, Mobile-Friendly 1-5, Security 1-5).
      placeholder: |
        - Maturity: 4/5
        - Mobile-Friendly: 5/5
        - Security: 5/5
        - Candidate Score: 14/15
    validations:
      required: true
  - type: textarea
    id: problem_statement
    attributes:
      label: Problem Statement / Opportunity Description
      description: Describe the operational issue experienced or the business opportunity unlocked via Nexus.
      placeholder: |
        Describe the problem or opportunity in detail...
    validations:
      required: true
  - type: textarea
    id: technical_specification
    attributes:
      label: Technical Specification & Implementation Architecture
      description: Outline the code, protocol bridge, or Nexus BFF changes required.
      placeholder: |
        Specify code changes, native managers, TS services, or Nexus endpoints...
    validations:
      required: true
  - type: textarea
    id: kb_reference
    attributes:
      label: Knowledge Base (KB) & Documentation Reference
      description: Link any corresponding Knowledge Base article or documentation path.
      placeholder: |
        - KB Article: docs/kb/NEXUS_DECENTRALIZED_SYSTEMS_KB.md (KB-001)
        - Research Doc: docs/reports/NEXUS_DECENTRALIZED_SYSTEMS_RESEARCH.md
    validations:
      required: false
